name: Build KaelltzyyD1 Kernel

on:
  workflow_dispatch:
    inputs:
      reflex:
        description: "Pasang governor Reflex (hilangkan centang kalau build gagal karena Reflex)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel-src
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev lz4 zip cpio python3 rsync git curl libncurses5 libtinfo5
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo

      - name: Sync AOSP kernel build tools
        run: |
          export PATH=$HOME/bin:$PATH
          git config --global user.email "ci@example.com"
          git config --global user.name "KaelltzyyD1"
          git config --global color.ui false
          mkdir aosp && cd aosp
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1 --no-tags --no-repo-verify
          repo sync -c -j8 --no-tags --no-clone-bundle
          rm -rf common
          mv ../kernel-src common

      - name: Apply Schedhorizon governor
        continue-on-error: true
        working-directory: aosp/common
        run: |
          curl -sfL "https://github.com/LoggingNewMemory/SuiKernel-android12-5.10/compare/cc08dc3bfd1f2eadc6edc7603ed6d01c365c3d15...d1a5000f1f6eb13044716b7bc759ca3aeae2f8bc.patch" -o ../schedhorizon.patch
          git am --3way ../schedhorizon.patch || { git am --abort; echo "Schedhorizon gagal diterapkan, lanjut tanpa itu"; exit 1; }

      - name: Add Reflex governor
        if: ${{ inputs.reflex }}
        continue-on-error: true
        working-directory: aosp/common
        run: |
          curl -sfL "https://raw.githubusercontent.com/firelzrd/reflex/main/patches/0001-Reflex-CPUFreq-Governor-v0.2.1.patch" -o ../reflex.patch
          patch -p1 --dry-run < ../reflex.patch
          patch -p1 < ../reflex.patch
          touch ../reflex.flag
          echo "Reflex berhasil dipasang"

      - name: Add Kaelltzy governor
        continue-on-error: true
        working-directory: aosp/common
        run: |
          # Salin governor performance bawaan, ganti nama jadi Kaelltzy
          sed -e 's/performance/kaelltzy/g' -e 's/PERFORMANCE/KAELLTZY/g' drivers/cpufreq/cpufreq_performance.c > drivers/cpufreq/cpufreq_kaelltzy.c
          sed -i 's/"kaelltzy"/"Kaelltzy"/' drivers/cpufreq/cpufreq_kaelltzy.c
          python3 - << 'PY'
          p = "drivers/cpufreq/Kconfig"
          s = open(p).read()
          blk = "config CPU_FREQ_GOV_KAELLTZY\n\ttristate \"Kaelltzy governor\"\n\thelp\n\t  Governor Kaelltzy: menahan CPU di frekuensi maksimum.\n\n"
          key = "config CPU_FREQ_GOV_POWERSAVE"
          assert key in s, "Kconfig tidak cocok"
          open(p, "w").write(s.replace(key, blk + key, 1))
          open("drivers/cpufreq/Makefile", "a").write("obj-$(CONFIG_CPU_FREQ_GOV_KAELLTZY)\t+= cpufreq_kaelltzy.o\n")
          PY
          grep -n "Kaelltzy" drivers/cpufreq/cpufreq_kaelltzy.c

      - name: Add KernelSU
        working-directory: aosp/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          ls -la drivers/kernelsu

      - name: Apply KaelltzyyD1 config
        working-directory: aosp
        run: |
          # build.sh GKI menolak defconfig yang diedit manual, jadi pengecekannya dimatikan
          grep -rl check_defconfig common/build.config.* | xargs -r sed -i 's/\bcheck_defconfig\b/true/g'
          cat >> common/arch/arm64/configs/gki_defconfig << 'EOF'

          # KaelltzyyD1 (racikan mengikuti SuiKernel)
          CONFIG_CPU_FREQ_GOV_SCHEDHORIZON=y
          CONFIG_CPU_FREQ_GOV_KAELLTZY=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_MQ_IOSCHED_DEADLINE=n
          CONFIG_MQ_IOSCHED_KYBER=n
          CONFIG_IOSCHED_BFQ=n
          CONFIG_BFQ_GROUP_IOSCHED=n
          CONFIG_HZ_300=y
          CONFIG_SCHED_MC=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZSWAP=n
          CONFIG_KSU=y
          CONFIG_MODULES=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          EOF
          [ -f reflex.flag ] && echo "CONFIG_CPU_FREQ_GOV_REFLEX=y" >> common/arch/arm64/configs/gki_defconfig || true

      - name: Build kernel
        working-directory: aosp
        run: |
          echo "== clang yang tersedia =="
          ls -d prebuilts-master/clang/host/linux-x86/clang-r* || true

          # Versi clang: ambil dari build.config kalau ada, kalau tidak pakai r416183b (standar android12-5.10)
          CLANG_VERSION=$(grep -rhoP '^\s*CLANG_VERSION=\K[A-Za-z0-9]+' common/build.config.* 2>/dev/null | head -n1 || true)
          CLANG_VERSION=${CLANG_VERSION:-r416183b}
          CLANG_DIR=$PWD/prebuilts-master/clang/host/linux-x86/clang-${CLANG_VERSION}
          if [ ! -d "$CLANG_DIR" ]; then
            CLANG_DIR=$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b
          fi
          if [ ! -d "$CLANG_DIR" ]; then
            echo "clang tidak ada di hasil repo sync, mengunduh clang-r416183b"
            mkdir -p $PWD/clang-fallback
            curl -sfL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" | tar -xz -C clang-fallback
            CLANG_DIR=$PWD/clang-fallback
          fi
          echo "pakai clang: $CLANG_DIR"
          export PATH=$CLANG_DIR/bin:$PATH
          clang --version

          # Build langsung dengan make (tanpa build.sh) supaya clang pasti terpakai
          export ARCH=arm64
          export KBUILD_BUILD_USER=KaelltzyyD1
          cd common
          MAKE_ARGS="O=$PWD/../out LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          make $MAKE_ARGS gki_defconfig
          make $MAKE_ARGS -j$(nproc) Image
          ls -la ../out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp aosp/out/arch/arm64/boot/Image AnyKernel3/Image
          cat > AnyKernel3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=KaelltzyyD1 GKI 5.10
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          cd AnyKernel3
          zip -r9 ../KaelltzyyD1-GKI-5.10.zip * -x .git README.md '*placeholder'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KaelltzyyD1-GKI-5.10
          path: KaelltzyyD1-GKI-5.10.zip
          
